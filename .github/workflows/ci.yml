name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set timezone
      run: |
        sudo timedatectl set-timezone Asia/Tokyo
        echo "TZ=Asia/Tokyo" >> $GITHUB_ENV

    - name: Setup pnpm and Node.js ${{ matrix.node-version }}
      uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
      with:
        runtime: node@${{ matrix.node-version }}
        cache: true
        require-lockfile: true

    - name: Lint check
      run: pnpm run lint

    - name: Format check
      run: pnpm run format:check

    - name: Type check
      run: pnpm run build

    # TODO: Enable tests when test files are added
    # - name: Run tests
    #   run: pnpm test
