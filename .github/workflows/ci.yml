name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [26.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set timezone
      run: |
        sudo timedatectl set-timezone Asia/Tokyo
        echo "TZ=Asia/Tokyo" >> $GITHUB_ENV

    - name: Setup pnpm and Node.js ${{ matrix.node-version }}
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: node@${{ matrix.node-version }}
        cache: true
        require-lockfile: true

    - name: Lint check
      run: pnpm run lint

    - name: Format check
      run: pnpm run format:check

    - name: Type check
      run: pnpm run build && pnpm run type-check:test

    # TODO: Enable tests when test files are added
    # - name: Run tests
    #   run: pnpm test
